<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../js/clientes.js"></script>
</head>

<body onload="carregarClientes()">
    <section id="clientes" class="aba">
        <h2>Cadastro de Clientes</h2>
        <input type="text" id="cliNome" placeholder="Nome Completo" required>
        <input type="text" id="cliBairro" placeholder="Bairro" required>
        <input type="text" id="cliRua" placeholder="Rua" required>
        <input type="number" id="cliNumCasa" placeholder="Numero da casa" required>
        <button onclick="cadastrarCliente()">Cadastrar Cliente</button>
    </section>
    <div>
        <table id="tabelaClientes">
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Nome</td>
                    <td>Endereço</td>
                    <td>Numero da casa</td>
                    <td>Bairro</td>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</body>

</html>
